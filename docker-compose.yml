version: '3.8'

services:
  # Redis message bus
  redis:
    image: redis:7-alpine
    container_name: cortix-redis
    ports:
      - "6379:6379"
    restart: always

  # PostgreSQL DB for production
  postgres:
    image: postgres:15-alpine
    container_name: cortix-postgres
    environment:
      POSTGRES_DB: cortix
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
